name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  prepare-yarn-cache-ubuntu:
    if: github.event_name == 'push'
    uses: ./.github/workflows/prepare-cache.yml
    with:
      os: ubuntu-latest
  prepare-yarn-cache-macos:
    if: github.event_name == 'push'
    uses: ./.github/workflows/prepare-cache.yml
    with:
      os: macos-latest
  prepare-yarn-cache-windows:
    if: github.event_name == 'push'
    uses: ./.github/workflows/prepare-cache.yml
    with:
      os: windows-latest

  ts-compatibility:
    name: TypeScript Compatibility
    runs-on: ubuntu-latest
    needs: prepare-yarn-cache-ubuntu
    if: ${{ always() && !cancelled() && (github.event_name == 'pull_request' || needs.prepare-yarn-cache-ubuntu.result == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Yarn install
        run: yarn --immutable
      - name: Yarn build
        run: yarn build
      - name: Run ts integration
        run: yarn test-ts --selectProjects ts-integration
      - name: Run type tests
        run: yarn test-types --target '>=5.4 <7.0' # For documentation, see: https://tstyche.org/guides/typescript-versions
      - name: Verify TypeScript@5.4 compatibility
        run: yarn verify-old-ts
      - name: Run eslint with type info
        run: yarn lint-ts-files
      - name: Run tests depending on type information
        run: yarn test-with-type-info

  static-checks:
    name: Static Checks (Lint, Typecheck, Yarn Validate)
    runs-on: ubuntu-latest
    needs: prepare-yarn-cache-ubuntu
    if: ${{ always() && !cancelled() && (github.event_name == 'pull_request' || needs.prepare-yarn-cache-ubuntu.result == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Yarn install
        run: yarn --immutable
      - name: Build TypeScript
        run: yarn build:ts
      - name: Build JavaScript
        run: yarn build:js
      - name: Run typecheck examples
        run: yarn typecheck:examples
      - name: Run typecheck tests
        run: yarn typecheck:tests
      - name: Verify Yarn PnP compatibility
        run: yarn verify-pnp
      - name: Run eslint
        run: yarn lint
      - name: Run prettier
        run: yarn lint:prettier:ci
      - name: Check changelog
        run: yarn check-changelog
      - name: Check copyright headers
        run: yarn check-copyright-headers
      - name: 'Check for unmet constraints (fix w/ "yarn constraints --fix")'
        run: yarn constraints
      - name: 'Check for duplicate dependencies (fix w/ "yarn dedupe")'
        run: yarn dedupe --check

  test-ubuntu:
    uses: ./.github/workflows/test.yml
    needs: prepare-yarn-cache-ubuntu
    if: ${{ always() && !cancelled() && (github.event_name == 'pull_request' || needs.prepare-yarn-cache-ubuntu.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    name: Ubuntu with shard ${{ matrix.shard }}
    with:
      os: ubuntu-latest
      shard: ${{ matrix.shard }}
      node-versions: ${{ github.event_name == 'pull_request' && '["lts/*"]' || '["18.x", "20.x", "22.x", "24.x"]' }}
  test-macos:
    uses: ./.github/workflows/test.yml
    needs: prepare-yarn-cache-macos
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    name: macOS with shard ${{ matrix.shard }}
    with:
      os: macos-latest
      shard: ${{ matrix.shard }}
      node-versions: '["18.x", "20.x", "22.x", "24.x"]'
      jasmine-node-version: 24.18.0
  test-windows:
    uses: ./.github/workflows/test.yml
    needs: prepare-yarn-cache-windows
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    name: Windows with shard ${{ matrix.shard }}
    with:
      os: windows-latest
      shard: ${{ matrix.shard }}
      node-versions: '["18.x", "20.x", "22.x", "24.x"]'

  test-leak:
    name: Node LTS on Ubuntu with leak detection
    runs-on: ubuntu-latest
    needs: prepare-yarn-cache-ubuntu
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Yarn install
        run: yarn --immutable
      - name: Yarn build
        run: yarn build:js
      - name: Run tests with leak detection
        run: yarn test-leak

  test-runtime-vm-modules:
    name: Node ${{ matrix.node-version }} on Ubuntu with --experimental-vm-modules (jest-runtime)
    runs-on: ubuntu-latest
    needs: prepare-yarn-cache-ubuntu
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Yarn install
        run: yarn --immutable
      - name: Yarn build
        run: yarn build:js
      - name: Get number of CPU cores
        id: cpu-cores
        uses: SimenB/github-actions-cpu-cores@97330871fe1b7d3529392ea000e3d2c4b357e403 # v3
      - name: Run jest-runtime tests with --experimental-vm-modules
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: yarn jest-runtime-vm-modules-ci --max-workers ${{ steps.cpu-cores.outputs.count }}

  test-coverage:
    name: Node LTS on Ubuntu with coverage (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    runs-on: ubuntu-latest
    needs: prepare-yarn-cache-ubuntu
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Yarn install
        run: yarn --immutable
      - name: Yarn build
        run: yarn build:js
      - name: Get number of CPU cores
        id: cpu-cores
        uses: SimenB/github-actions-cpu-cores@97330871fe1b7d3529392ea000e3d2c4b357e403 # v3
      - name: Run tests with coverage
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: yarn jest-coverage --color --config jest.config.ci.mjs --max-workers ${{ steps.cpu-cores.outputs.count }} --shard=${{ matrix.shard }}
