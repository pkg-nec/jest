name: macOS notifier diagnostic

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Number of focused detectOpenHandles runs (1 through 20)
        required: true
        type: number
        default: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.os }} with ${{ matrix.workers }} workers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        workers: [1, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Yarn install
        run: yarn --immutable
      - name: Yarn build
        run: yarn build:js
      - name: Record environment
        run: |
          {
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            sw_vers
            uname -a
            echo "logical CPUs: $(sysctl -n hw.logicalcpu)"
            node --version
            yarn --version
          } | tee environment.txt
      - name: Repeat focused notifier test
        id: focused
        continue-on-error: true
        timeout-minutes: 30
        env:
          DEBUG: notifier
          REPETITIONS: ${{ inputs.repetitions }}
          WORKERS: ${{ matrix.workers }}
        run: |
          set -o pipefail
          if [[ ! "$REPETITIONS" =~ ^[0-9]+$ ]] || (( REPETITIONS < 1 || REPETITIONS > 20 )); then
            echo "::error::repetitions must be an integer from 1 through 20"
            exit 2
          fi

          : > notifier-diagnostic.log
          passes=0
          failures=0

          for ((attempt = 1; attempt <= REPETITIONS; attempt++)); do
            echo "::group::Focused attempt ${attempt}/${REPETITIONS}" | tee -a notifier-diagnostic.log
            if yarn jest-jasmine-ci e2e/__tests__/detectOpenHandles.ts --max-workers "$WORKERS" 2>&1 | tee -a notifier-diagnostic.log; then
              passes=$((passes + 1))
              result=PASS
            else
              failures=$((failures + 1))
              result=FAIL
            fi
            echo "Focused attempt ${attempt}: ${result}" | tee -a notifier-diagnostic.log
            echo "::endgroup::" | tee -a notifier-diagnostic.log
          done

          {
            echo "focused passes=${passes}"
            echo "focused failures=${failures}"
          } | tee diagnostic-summary.txt

          test "$failures" -eq 0
      - name: Reproduce original shard
        id: shard
        continue-on-error: true
        timeout-minutes: 15
        env:
          DEBUG: notifier
          WORKERS: ${{ matrix.workers }}
        run: |
          set -o pipefail
          yarn jest-jasmine-ci --max-workers "$WORKERS" --shard=2/4 2>&1 | tee -a notifier-diagnostic.log

      - name: Record outcomes
        if: always()
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          SHARD_OUTCOME: ${{ steps.shard.outcome }}
        run: |
          touch diagnostic-summary.txt
          {
            echo "focused outcome=${FOCUSED_OUTCOME}"
            echo "shard outcome=${SHARD_OUTCOME}"
          } >> diagnostic-summary.txt
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-notifier-${{ matrix.os }}-${{ matrix.workers }}-workers
          path: |
            diagnostic-summary.txt
            environment.txt
            notifier-diagnostic.log
          if-no-files-found: warn
          retention-days: 7
      - name: Summarize result
        if: always()
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          SHARD_OUTCOME: ${{ steps.shard.outcome }}
        run: |
          {
            echo "## macOS notifier diagnostic"
            echo
            echo "- OS: ${{ matrix.os }}"
            echo "- Workers: ${{ matrix.workers }}"
            echo "- Focused runs: ${FOCUSED_OUTCOME}"
            echo "- Original shard: ${SHARD_OUTCOME}"
            echo
            if [[ -f diagnostic-summary.txt ]]; then
              echo '```text'
              cat diagnostic-summary.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$FOCUSED_OUTCOME" == success && "$SHARD_OUTCOME" == success ]]
