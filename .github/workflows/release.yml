name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Reject unstable release event
        env:
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$RELEASE_DRAFT" != "false" || "$RELEASE_PRERELEASE" != "false" ]]; then
            echo "Only stable GitHub Releases may publish pkg-nec packages" >&2
            exit 1
          fi
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Fetch main for release validation
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build and audit package identities
        run: |
          yarn build:js
          yarn check:pkg-nec-identity
      - name: Run focused release tooling tests
        run: yarn run test:pkg-nec-tooling
      - name: Prepare release candidate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: yarn prepare:pkg-nec-release "$RELEASE_TAG"
      - name: Validate release candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn validate:pkg-nec-release .pkg-nec-release/release-ledger.json
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: pkg-nec-release-candidate
          path: .pkg-nec-release/
          retention-days: 30

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Install exact npm
        run: npm install --global npm@11.19.0
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-nec-release-candidate
          path: .pkg-nec-release
      - name: Publish in ledger order with strict resumption
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          yarn publish:pkg-nec-release .pkg-nec-release/release-ledger.json .pkg-nec-release/publication-journal.json "$RELEASE_TAG"


      - name: Summarize publication progress
        if: ${{ always() }}
        run: |
          if [[ -f .pkg-nec-release/publication-journal.json ]]; then
            yarn summarize:pkg-nec-publication \
              .pkg-nec-release/release-ledger.json \
              .pkg-nec-release/publication-journal.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload publication journal
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          include-hidden-files: true
          name: pkg-nec-publication-evidence
          path: .pkg-nec-release/publication-journal.json
          retention-days: 30

  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Install exact npm
        run: npm install --global npm@11.19.0
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-nec-release-candidate
          path: .pkg-nec-release
      - name: Download publication journal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-nec-publication-evidence
          path: .pkg-nec-release
      - name: Verify complete registry batch
        run: |
          yarn verify:pkg-nec-release \
            .pkg-nec-release/release-ledger.json \
            .pkg-nec-release/publication-journal.json \
            .pkg-nec-release/registry-evidence.json \
            .pkg-nec-release/registry-evidence.md \
            .pkg-nec-release/provenance-evidence.json \
            .pkg-nec-release/provenance-evidence.md
      - name: Upload registry evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          include-hidden-files: true
          name: pkg-nec-registry-evidence
          path: |
            .pkg-nec-release/registry-evidence.json
            .pkg-nec-release/registry-evidence.md
            .pkg-nec-release/provenance-evidence.json
            .pkg-nec-release/provenance-evidence.md
          retention-days: 30

  evidence:
    needs: [validate, publish, verify]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download pkg-nec-release-candidate
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-nec-release-candidate
          path: .pkg-nec-release
      - name: Download pkg-nec-publication-evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-nec-publication-evidence
          path: .pkg-nec-release
      - name: Download pkg-nec-registry-evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-nec-registry-evidence
          path: .pkg-nec-release
      - name: Write workflow summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p .pkg-nec-release
          {
            printf '# pkg-nec release workflow evidence\n\n'
            printf -- '- Release tag: `%s`\n' "$RELEASE_TAG"
            cat <<'SUMMARY'
          - Source workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Validate job: `${{ needs.validate.result }}`
          - Publish job: `${{ needs.publish.result }}`
          - Verify job: `${{ needs.verify.result }}`
          SUMMARY
          } > .pkg-nec-release/workflow-summary.md
      - name: Attach durable release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          assets=(.pkg-nec-release/workflow-summary.md)
          if [[ -f .pkg-nec-release/release-ledger.json ]]; then
            plan_path="$(jq -er '.releasePlan.path | select(type == "string")' .pkg-nec-release/release-ledger.json)"
            plan_digest="$(jq -er '.releasePlan.digest | select(test("^sha256-[0-9a-f]{64}$"))' .pkg-nec-release/release-ledger.json)"
            plan_basename="${plan_path##*/}"
            if ! [[ "$plan_path" == "docs/releases/$plan_basename" ]] ||
              [[ -z "$plan_basename" || "$plan_basename" == "." || "$plan_basename" == ".." ]] ||
              [[ "$plan_basename" == *[!a-zA-Z0-9._-]* ]]
            then
              echo "Invalid release plan asset path" >&2
              exit 1
            fi
            plan_asset=".pkg-nec-release/$plan_basename"
            if [[ ! -f "$plan_asset" ]]; then
              echo "Missing copied release plan asset" >&2
              exit 1
            fi
            actual_plan_digest="sha256-$(sha256sum "$plan_asset" | awk '{print $1}')"
            if [[ "$actual_plan_digest" != "$plan_digest" ]]; then
              echo "Copied release plan digest mismatch" >&2
              exit 1
            fi
            assets+=("$plan_asset")
          fi
          for asset in \
            .pkg-nec-release/release-ledger.json \
            .pkg-nec-release/release-ledger.md \
            .pkg-nec-release/publication-journal.json \
            .pkg-nec-release/registry-evidence.json \
            .pkg-nec-release/registry-evidence.md \
            .pkg-nec-release/provenance-evidence.json \
            .pkg-nec-release/provenance-evidence.md
          do
            if [[ -f "$asset" ]]; then
              assets+=("$asset")
            fi
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "${{ github.repository }}" --clobber
